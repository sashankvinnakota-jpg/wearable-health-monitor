; ─────────────────────────────────────────────────────────────────────────────
; Wearable Health Monitor — ESP32 38-pin dev board
;
; Environments:
;   esp32dev    — the firmware. Default target.
;   probe       — standalone MAX30102 bus diagnostic, compiled on its own.
;                 Run with:  pio run -e probe -t upload
;   bringup_imu — standalone MPU-6050 bring-up / validation.
;                 Run with:  pio run -e bringup_imu -t upload
;
; The two diagnostic envs each define their own setup()/loop(), so every env
; must include exactly one of {main.cpp, probe/, bringup/} and exclude the
; others — otherwise the link fails with "multiple definition of setup()".
; ─────────────────────────────────────────────────────────────────────────────

; Without this, a bare `pio run` (and the VS Code toolbar buttons) would build
; every environment including the diagnostics. Those are opt-in: -e <name>.
[platformio]
default_envs = esp32dev

[env]
platform      = espressif32@6.4.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; esp32_exception_decoder turns a panic backtrace into file:line.
; time prefixes each line with a host timestamp — useful for spotting stalls.
monitor_filters = esp32_exception_decoder, time

; ── Main firmware ─────────────────────────────────────────────────────────────
[env:esp32dev]
; Only external libraries: SSD1306 display.
; All sensor drivers are register-level — no Adafruit IMU / PPG libraries.
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

; Everything except the standalone diagnostics, which have their own
; setup()/loop(). Evaluated left to right — the excludes must come after +<*>.
build_src_filter = +<*> -<probe/> -<bringup/>

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
; ── Bench tooling — enable ONE at a time, then reflash ────────────────────────
; Self-test: PASS/FAIL table at boot. Board must be flat and still.
;   -DRUN_SELFTEST=1
; Calibration: six-position routine. Halts afterwards; reflash without it.
;   -DRUN_CALIBRATION=1
; CSV telemetry: full 100 Hz stream for tools/capture_and_plot.py.
; Also set LOG_MIN_LEVEL to 2 in board_config.h so logs don't interleave.
;   -DCSV_STREAM_ENABLED=1

; Partition layout (4 MB flash, standard app/OTA/SPIFFS split).
board_build.partitions = default.csv

; ── Standalone MAX30102 probe ─────────────────────────────────────────────────
; Depends on nothing from the project — only Wire. Tests both bus speeds and
; both register-read methods, with the MPU6050 as a control.
[env:probe]
build_src_filter = -<*> +<probe/>

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17

; ── Standalone MPU-6050 bring-up ──────────────────────────────────────────────
; Depends on nothing from the project — only Wire. Bus scan, WHO_AM_I, config
; readback verification, bus reliability, and resting-signal sanity checks.
; No lib_deps on purpose: if this passes and the firmware does not, the fault
; is in a layer this build never compiled.
[env:bringup_imu]
build_src_filter = -<*> +<bringup/bringup_mpu6050.cpp>

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
    