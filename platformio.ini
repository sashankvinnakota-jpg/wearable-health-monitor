; ─────────────────────────────────────────────────────────────────────────────
; Wearable Health Monitor — ESP32 38-pin dev board
;
; Environments:
;   esp32dev  — the firmware. Default target.
;   probe     — standalone MAX30102 bus diagnostic, compiled on its own.
;               Run with:  pio run -e probe -t upload
; ─────────────────────────────────────────────────────────────────────────────

[env]
platform      = espressif32@6.4.0
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; esp32_exception_decoder turns a panic backtrace into file:line.
; time prefixes each line with a host timestamp — useful for spotting stalls.
monitor_filters = esp32_exception_decoder, time

; ── Main firmware ─────────────────────────────────────────────────────────────
[env:esp32dev]
; Only external libraries: SSD1306 display.
; All sensor drivers are register-level — no Adafruit IMU / PPG libraries.
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9

; Everything except the standalone probe, which has its own setup()/loop().
build_src_filter = +<*> -<probe/>

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
; ── Bench tooling — enable ONE at a time, then reflash ────────────────────────
; Self-test: PASS/FAIL table at boot. Board must be flat and still.
;   -DRUN_SELFTEST=1
; Calibration: six-position routine. Halts afterwards; reflash without it.
;   -DRUN_CALIBRATION=1
; CSV telemetry: full 100 Hz stream for tools/capture_and_plot.py.
; Also set LOG_MIN_LEVEL to 2 in board_config.h so logs don't interleave.
;   -DCSV_STREAM_ENABLED=1

; Increase stack for main loop — FreeRTOS tasks have their own stacks
board_build.partitions = default.csv

; ── Standalone MAX30102 probe ─────────────────────────────────────────────────
; Depends on nothing from the project — only Wire. Tests both bus speeds and
; both register-read methods, with the MPU6050 as a control.
[env:probe]
build_src_filter = -<*> +<probe/>

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -std=gnu++17
